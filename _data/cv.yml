- title: Summary
  type: list
  contents:
    - Vehicle chassis control and motion planning engineer with more than ten years of experience in automotive engineering. Technical lead and project owner for safety-critical planning and control functions, with end-to-end experience spanning algorithm architecture, simulation, real-time implementation, vehicle integration, tuning, and validation.

- title: Technical Focus
  type: nested_list
  contents:
    - title: Vehicle Dynamics and Control
      items:
        - Vehicle dynamics modeling, analysis, and state estimation
        - Vehicle stability control and integrated chassis control
        - Actuator coordination for braking, steering, and suspension systems
        - Optimal, model predictive, and optimization-based control
    - title: Motion Planning and Control
      items:
        - Path and trajectory planning for autonomous vehicle maneuvers
        - Collision avoidance and minimum-risk motion planning
        - Path and trajectory tracking control
        - Planning and control integration for safety-critical functions
    - title: Validation
      items:
        - Model-based development and simulation using MATLAB/Simulink, CarSim, CarMaker, and Isaac Sim
        - Real-time implementation and rapid control prototyping using dSPACE MicroAutoBox II and NVIDIA Jetson AGX
        - Vehicle integration, calibration, in-vehicle testing, and recorded-data analysis
        - Requirements-based verification, unit and integration testing, and vehicle-level evaluation

