- title: Summary
  type: list
  contents:
    - Vehicle dynamics and control engineer with more than ten years of experience in automotive engineering, specializing in motion planning, trajectory tracking, and optimization-based control for autonomous driving.
    - At HL Mando, I serve as a technical lead and project owner, leading development from function architecture and algorithm design through simulation, real-time implementation, vehicle integration, calibration, and validation.

- title: Technical Focus
  type: nested_list
  contents:
    - title: Vehicle Dynamics & Control
      items:
        - Integrated chassis control, trajectory tracking, and vehicle stabilization
        - Steering–brake coordination and wheel-level optimal control allocation
        - Nonlinear and optimization-based control using SMC, LQR, MPC, and MPPI
        - Vehicle state estimation using Kalman filters, sliding-mode observers, and receding-horizon estimators
    - title: Motion Planning & Optimization
      items:
        - Path and trajectory generation for autonomous vehicle maneuvers
        - G2-continuous path generation with collision-avoidance constraints and consideration of vehicle dynamics
        - Optimization-based planning for evasive maneuvers, automated trailer hitching, and trailer parking
        - Integration of motion planning, trajectory tracking, and vehicle stabilization
    - title: Implementation & Validation
      items:
        - Algorithm development and implementation using C, Python, and MATLAB/Simulink
        - Vehicle and scenario simulation using CarSim, CarMaker, and CARLA
        - Real-time implementation and rapid control prototyping using dSPACE MicroAutoBox II and NVIDIA Jetson AGX
        - Vehicle integration, calibration, scenario-based testing, and recorded-data analysis

- title: Experience
  type: time_table
  contents:
    - title: Senior Research Engineer
      institution: HL Mando
      year: 2015.08 - Present
      description:
        - title: Vehicle Dynamics & Control / Motion Planning & Optimization
          contents:
            - Lead vehicle control development from function architecture and algorithm design through simulation, real-time implementation, vehicle integration, calibration, and validation.
            - Develop integrated chassis control using hierarchical control architectures, sliding-mode control, and optimal control allocation, alongside vehicle state estimation using Kalman filters, sliding-mode observers, and receding-horizon estimators.
            - Develop motion planning and control algorithms for vehicle stability control, evasive collision avoidance, autonomous driving failover control, automated trailer hitching, and trailer parking. Apply nonlinear and optimization-based control methods (SMC, LQR, MPC, and MPPI), with G2-continuous path generation, collision-avoidance constraints, and consideration of vehicle dynamics.
            - Implement and evaluate controllers using MATLAB/Simulink, Python, CarSim, CarMaker, CARLA, dSPACE MicroAutoBox II, and NVIDIA Jetson AGX. Development includes simulation and real-time prototyping, with real-world vehicle tuning and scenario-based testing for vehicle-evaluated functions.
            - Earlier work included chassis system design for E-Corner modules, gear optimization, durability analysis, and multibody dynamics analysis for steering systems.
    - title: Research Engineer
      institution: Samsung Techwin (now Hanwha Aerospace)
      year: 2012.08 - 2015.07
      description:
        - Designed integral helical gears for turbo compressors and performed system dynamics analysis.
        - Performed multibody dynamics analysis and vehicle stability assessment for vehicle-mounted remote weapon systems.
    - title: Engineering Intern
